<!-- index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>AgriVeritas</title>
<meta name="description" content="Dashboard interaktif proyek robotik AgriVeritas oleh CircuLoop — JMC 2026">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= AMBIENT BACKDROP ================= -->
<div class="eco-backdrop" aria-hidden="true">
  <div class="sun-glow"></div>
  <div class="bubbles" id="bubbleField"></div>
  <div class="lens-flare lens-flare--a"></div>
  <div class="lens-flare lens-flare--b"></div>
</div>
<div class="cursor-aura" id="cursorAura" aria-hidden="true"></div>

<!-- ================= PHASE 1 — BOOT SCREEN ================= -->
<section id="bootScreen" class="phase boot-screen" aria-label="Layar booting VeritasOS">
  <div class="boot-frame">
    <div class="boot-frame__header">
      <span class="boot-dot boot-dot--r"></span>
      <span class="boot-dot boot-dot--y"></span>
      <span class="boot-dot boot-dot--g"></span>
      <span class="boot-frame__title">VeritasOS v1.0 — Terminal Sistem</span>
    </div>
    <div class="boot-frame__body">
      <pre class="boot-log" id="bootLog" aria-live="polite"></pre>
      <div class="boot-progress">
        <div class="boot-progress__track">
          <div class="boot-progress__fill" id="bootFill"></div>
        </div>
        <span class="boot-progress__pct" id="bootPct">0%</span>
      </div>
    </div>
  </div>
</section>

<!-- ================= PHASE 2 — LOCKSCREEN / START MENU ================= -->
<section id="lockScreen" class="phase lock-screen" aria-label="Layar mulai" hidden>
  <div class="lock-hero" id="lockHero">
